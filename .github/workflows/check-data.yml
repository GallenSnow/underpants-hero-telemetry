name: Conferir dados recebidos

# Roda só quando disparado à mão. Mostra contagens e as últimas linhas
# (sem IP, sem texto bruto do payload) para confirmar que a telemetria chegou.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Totais
        run: |
          npx wrangler d1 execute uh-telemetry --remote --command "
            SELECT 'runs' AS tabela, COUNT(*) AS linhas, MIN(received_at) AS primeira, MAX(received_at) AS ultima FROM runs
            UNION ALL
            SELECT 'feedback', COUNT(*), MIN(received_at), MAX(received_at) FROM feedback"
      - name: Últimas runs
        run: |
          npx wrangler d1 execute uh-telemetry --remote --command "
            SELECT received_at, kind, payload_schema, lifecycle, revision, build_version, build_channel, character,
                   difficulty, result, wave_reached, duration_s, locale
            FROM runs ORDER BY received_at DESC LIMIT 10"
      - name: Últimos feedbacks
        run: |
          npx wrangler d1 execute uh-telemetry --remote --command "
            SELECT received_at, run_id IN (SELECT run_id FROM runs) AS run_encontrada, rating,
                   LENGTH(comment) AS tamanho_comentario, tags, locale, question_version
            FROM feedback ORDER BY received_at DESC LIMIT 10"
